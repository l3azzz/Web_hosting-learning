server {
    listen 80;
    listen [::]:80;
    server_name devprozone.com www.devprozone.com;

    root /var/www/devprozone.com/html;
    index index.html index.htm index.nginx-debian.html;

    access_log /var/log/nginx/devprozone.access.log;
    error_log  /var/log/nginx/devprozone.error.log;

    location / {
        try_files $uri $uri/ =404;
    }
}
